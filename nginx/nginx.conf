events {
    worker_connections 1024;
}

http {
    # ─── Upstream Services ─────────────────────────────────────
    upstream frontend {
        server frontend:5173;
    }

    upstream backend_api {
        server backend:8080;
    }

    upstream mediamtx_webrtc {
        server mediamtx:8889;
    }

    # ─── Main Server ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Frontend (Vite dev server)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Node.js REST API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large body support for face image uploads
            client_max_body_size 50m;
        }

        # Face Engine API
        location /face-engine/ {
            proxy_pass http://face-recognition-engine:8000/;
            proxy_read_timeout 30s;
            client_max_body_size 5M;
        }

        # MediaMTX WebRTC signaling (WHEP/WHIP endpoints)
        location /mediamtx/ {
            rewrite ^/mediamtx/(.*) /$1 break;
            proxy_pass http://mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
