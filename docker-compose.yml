services:
  mongo:
    image: mongo:latest
    container_name: face-recognition-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: face-recognition-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  face-engine:
    build:
      context: ./face-engine
    container_name: face-recognition-engine
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/face_recognition
      - DB_NAME=face_recognition
      - REDIS_URL=redis://redis:6379
      - MEDIAMTX_URL=rtsp://mediamtx:8554
    depends_on:
      - redis
      - mediamtx
    volumes:
      - ./face-engine:/app
      - ./face-engine/index:/app/index
      - ./data/faiss:/app/data

  backend:
    build:
      context: ./server
    container_name: face-recognition-backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/face_recognition
      - FACE_ENGINE_URL=http://face-engine:8000
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - face-engine
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: face-recognition-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
      - "8889:8889" # WebRTC HTTP/WHEP
      - "8189:8189/udp" # WebRTC ICE/UDP
    environment:
      - MTX_LOGLEVEL=info
      - MTX_LOGDESTINATIONS=stdout
      - MTX_RTSP=yes
      - MTX_RTSPADDRESS=:8554
      - MTX_WEBRTC=yes
      - MTX_WEBRTCADDRESS=:8889
      - MTX_WEBRTCALLOWORIGINS=*
      - MTX_WEBRTCICESERVERS2=url:stun:stun.l.google.com:19302
      - MTX_HLS=no
      - MTX_RTMP=no
      - MTX_SRT=no
      - MTX_PATHS_CAM-IN_SOURCE=rtsp://admin:password@192.168.1.2:554/cam/realmonitor?channel=4&subtype=0
      - MTX_PATHS_CAM-OUT_SOURCE=rtsp://admin:password@192.168.1.2:554/cam/realmonitor?channel=3&subtype=0
      - MTX_PATHS_CAM-ROOM_SOURCE=rtsp://admin:password@192.168.1.2:554/cam/realmonitor?channel=2&subtype=0
      - MTX_PATHS_CAM-ROOM2_SOURCE=rtsp://admin:password@192.168.1.2:554/cam/realmonitor?channel=1&subtype=0

  frontend:
    build:
      context: ./Faceapp
    container_name: face-recognition-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_MEDIAMTX_URL=http://localhost:8889
    volumes:
      - ./Faceapp:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    container_name: face-recognition-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - mediamtx
      - frontend

volumes:
  mongo-data:
  redis-data:
